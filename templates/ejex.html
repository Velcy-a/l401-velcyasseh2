<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2">
    <title>Solo Eje X</title>
    <style>
        #hoja {
            background-color: rgb(153, 102, 204, 0.5);
            font-size: 20px;
            font-family: "Times New Roman", cursive;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #tabla-x { 
            border-collapse: collapse; 
            margin-top: 20px; 
            margin-bottom: 20px;
        }

        #x1, #x2, #x3, #x4 {
            width: 60px; 
            height: 60px; 
            border: 1px solid black;
            text-align: center; 
            vertical-align: middle;
        }

        #descripcion {
            text-align: center;
            max-width: 600px;
            margin-bottom: 15px;
        }

        #menu-navegacion { 
            margin-top: 30px; 
            display: flex; 
            gap: 20px; 
        }

        #link-matriz, #link-eje {
            color: #fff;
            background-color: #333;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-family: sans-serif;
            font-size: 16px;
        }

        /* Lógica de color horizontal invertida basada en rangos de 4.5 para X */
        #x1 { background-color: {% if ejeX >= 4.5 %} #99cc66 {% else %} gray {% endif %}; }
        #x2 { background-color: {% if ejeX >= 0 and ejeX < 4.5 %} #99cc66 {% else %} gray {% endif %}; }
        #x3 { background-color: {% if ejeX >= -4.5 and ejeX < 0 %} #99cc66 {% else %} gray {% endif %}; }
        #x4 { background-color: {% if ejeX < -4.5 %} #99cc66 {% else %} gray {% endif %}; }
    </style>
</head>
<body id="hoja">

    <h1>Monitoreo Individual: Eje X</h1>
    <p id="descripcion">
        Esta sección analiza exclusivamente el desplazamiento horizontal del sensor. La fila se divide en 4 segmentos de 4.5 unidades de rango cada uno.
    </p>

    <p>Eje X = {{ ejeX }}</p>

    <table id="tabla-x">
        <tr>
            <td id="x1">X1</td>
            <td id="x2">X2</td>
            <td id="x3">X3</td>
            <td id="x4">X4</td>
        </tr>
    </table>

    <nav id="menu-navegacion">
        <a id="link-matriz" href="/">Volver a Matriz</a>
        <a id="link-eje" href="/ejey">Ver Eje Y</a>
    </nav>

</body>
</html>
